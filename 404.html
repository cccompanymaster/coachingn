<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>페이지를 찾을 수 없습니다 | 코칭엔</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/coachingn/assets/coachingn-logo-light.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Inter:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    html, body { height: 100%; }
    body {
      margin: 0; font-family: 'Pretendard', 'Inter', sans-serif; color: #2A1F1A;
      background: #FAF6F1; display: grid; place-items: center; padding: 40px;
    }
    .wrap { max-width: 600px; text-align: center; }
    .num { font-family: 'Inter', monospace; font-size: clamp(80px, 18vw, 160px); font-weight: 800; line-height: 1; color: #B68A6E; letter-spacing: -0.04em; }
    .serif { font-family: 'Cormorant Garamond', serif; font-style: italic; color: #8B6B54; }
    h1 { font-size: clamp(28px, 4vw, 40px); font-weight: 700; letter-spacing: -0.02em; margin: 20px 0 12px; }
    p { color: #4A3A30; line-height: 1.7; margin: 0 0 28px; }
    a { display: inline-flex; align-items: center; gap: 8px; padding: 14px 24px; border-radius: 999px; background: #2A1F1A; color: #FAF6F1; font-weight: 600; text-decoration: none; font-size: 15px; transition: background .2s; }
    a:hover { background: #B68A6E; }
  </style>
</head>
<body>
  <main class="wrap">
    <p class="num">404</p>
    <h1>찾으시는 <span class="serif">페이지가</span> 없습니다.</h1>
    <p>주소가 변경되었거나 일시적으로 접근할 수 없는 페이지입니다.<br/>홈으로 돌아가 다시 탐색해 주세요.</p>
    <a href="/coachingn/">홈으로 돌아가기 →</a>
  </main>
</body>
</html>
